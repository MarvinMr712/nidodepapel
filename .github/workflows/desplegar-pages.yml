name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No corta la publicacion si falla otro job.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `astro build` escribe el sitio entero en out/ gracias a
      # `output: "static"` y `outDir: "./out"` en astro.config.mjs.
      #
      # SITE_URL y BASE_PATH se definen en Settings > Variables del repositorio.
      # Si quedan vacias, astro.config.mjs usa la direccion real de GitHub Pages
      # (https://marvinmr712.github.io/nidodepapel).
      - name: Build estatico
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          PUBLIC_CONTACTO_EMAIL: ${{ vars.CONTACTO_EMAIL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
